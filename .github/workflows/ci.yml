name: Pull request checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Firestore security rules emulator tests
        run: npm run test:rules
      - name: TypeScript and Vite production build
        run: npm run build
